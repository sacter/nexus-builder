apiVersion: apps/v1
kind: Deployment
metadata:
  name: lowcode-frontend
  namespace: lowcode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lowcode-frontend
  template:
    metadata:
      labels:
        app: lowcode-frontend
    spec:
      containers:
        - name: frontend
          image: registry.example.com/lowcode-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
