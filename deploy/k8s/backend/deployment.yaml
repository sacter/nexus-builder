apiVersion: apps/v1
kind: Deployment
metadata:
  name: lowcode-backend
  namespace: lowcode
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lowcode-backend
  template:
    metadata:
      labels:
        app: lowcode-backend
    spec:
      containers:
        - name: backend
          image: registry.example.com/lowcode-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: lowcode-config
            - secretRef:
                name: lowcode-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
