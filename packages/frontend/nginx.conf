# ===================================================
# 设计器前端 Nginx 配置 (design-time only)
# 负责: 设计器 SPA 静态文件 + 代理设计态 API
# 不负责: 运行态页面 (/app/*) → 由 Renderer 处理
# ===================================================
server {
    listen 80;
    server_name localhost;

    # 设计器 SPA 入口
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 设计态 API → Backend 服务
    location /api/ {
        proxy_pass http://lowcode-backend-svc:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 文件上传资源 → Backend 服务
    location /uploads/ {
        proxy_pass http://lowcode-backend-svc:3000;
    }
}
